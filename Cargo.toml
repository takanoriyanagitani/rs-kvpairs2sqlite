[package]
name = "rs-kvpairs2sqlite"
version = "0.1.0"
edition = "2024"

description = "Convert JSON KV pairs from stdin to SQLite"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-kvpairs2sqlite"
homepage = "https://github.com/takanoriyanagitani/rs-kvpairs2sqlite"
documentation = "https://docs.rs/rs-kvpairs2sqlite/latest"
keywords = ["sqlite", "json", "kvstore", "convert", "wasi"]

exclude = [
  "kvpairs2sqlite.wasm",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "kvpairs2sqlite"

[dependencies.rusqlite]
version = "0.40.2"
default-features = false
features = [
    "bundled",
    "wasm32-wasi-vfs",
]

[dependencies.serde_json]
version = "1.0.154"
default-features = false
features = [
    "std",
]
